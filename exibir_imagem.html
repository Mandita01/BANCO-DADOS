<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens do projeto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
            gap: 20px;
        }
        figure {
            margin: 0;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        figcaption {
            margin-top: 8px;
            text-align: center;
            color: #555;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Imagens do projeto</h1>
        <section class="galeria" aria-label="Imagens adicionadas ao projeto">
            <figure>
                <img src="Captura%20de%20tela%202026-11-13%20013047.png" alt="Captura de tela adicionada em 13 de novembro de 2026 às 01:30">
                <figcaption>Captura de tela — 01:30</figcaption>
            </figure>
            <figure>
                <img src="Captura%20de%20tela%202026-11-13%20013315.png" alt="Captura de tela adicionada em 13 de novembro de 2026 às 01:33">
                <figcaption>Captura de tela — 01:33</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
